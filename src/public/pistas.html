<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pique · Reservar pista</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="/js/comun.js" defer></script>
  <script src="/js/pistas.js" defer></script>
</head>
<body>
  <header></header>
  <main>
    <h1>Reservar pista</h1>

    <div class="rejilla-2">
      <section class="tarjeta">
        <h2>Nueva reserva</h2>
        <div id="mensaje-reserva"></div>
        <form id="form-reserva" novalidate>
          <div class="fila">
            <div class="campo">
              <label for="reserva-pista">Pista</label>
              <select id="reserva-pista" required></select>
            </div>
            <div class="campo">
              <label for="reserva-fecha">Día</label>
              <input type="date" id="reserva-fecha" required>
            </div>
          </div>

          <label>Hora de inicio</label>
          <div class="leyenda">
            <span class="l-libre">Libre</span>
            <span class="l-ocupada">Ocupada</span>
            <span class="l-elegida">Elegida</span>
          </div>
          <div id="franjas" class="franjas"></div>

          <div class="campo">
            <label for="reserva-duracion">Duración</label>
            <select id="reserva-duracion">
              <option value="60">1 hora</option>
              <option value="90" selected>1 hora y media</option>
              <option value="120">2 horas</option>
              <option value="180">3 horas</option>
            </select>
          </div>
          <p id="resumen-reserva" class="detalle"></p>
          <button type="submit" class="boton boton-ancho" id="boton-reservar" disabled>Reservar</button>
        </form>
      </section>

      <section class="tarjeta">
        <h2>Pistas del club</h2>
        <ul id="lista-pistas" class="lista"></ul>
      </section>
    </div>

    <!-- Solo se muestra a los administradores (la API también lo comprueba) -->
    <section id="seccion-admin" class="tarjeta oculto">
      <h2>Administrar pistas <span class="etiqueta">admin</span></h2>
      <div id="mensaje-admin"></div>
      <div class="rejilla-2">
        <form id="form-pista" novalidate>
          <h3 id="titulo-form-pista">Nueva pista</h3>
          <input type="hidden" id="pista-id">
          <div class="campo">
            <label for="pista-nombre">Nombre</label>
            <input type="text" id="pista-nombre" maxlength="60" required>
          </div>
          <div class="campo">
            <label for="pista-descripcion">Descripción</label>
            <textarea id="pista-descripcion" rows="2"></textarea>
          </div>
          <div class="campo oculto" id="campo-activa">
            <label><input type="checkbox" id="pista-activa"> Activa (se puede reservar)</label>
          </div>
          <button type="submit" class="boton">Guardar</button>
          <button type="button" class="boton boton-secundario oculto" id="cancelar-edicion">Cancelar</button>
        </form>
        <div class="tabla-scroll">
          <table>
            <thead><tr><th>Pista</th><th>Estado</th><th></th></tr></thead>
            <tbody id="tabla-pistas"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
